<!DOCTYPE html>
<html class="staticrypt-html">
    <head>
        <meta charset="utf-8" />
        <title>Protected Page</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- do not cache this page -->
        <meta http-equiv="cache-control" content="max-age=0" />
        <meta http-equiv="cache-control" content="no-cache" />
        <meta http-equiv="expires" content="0" />
        <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT" />
        <meta http-equiv="pragma" content="no-cache" />

        <style>

:root {
  color-scheme: dark;
  --bg: #080d19;
  --panel: rgba(17, 26, 43, .88);
  --border: #293852;
  --text: #f4f7ff;
  --muted: #a5b1c8;
  --blue: #3978f6;
}

* { box-sizing: border-box; }

.staticrypt-html, .staticrypt-body {
  min-height: 100%;
  margin: 0;
}

.staticrypt-body {
  min-height: 100vh;
  color: var(--text);
  background:
    radial-gradient(ellipse at 15% 10%, #183566 0, transparent 42%),
    radial-gradient(ellipse at 90% 85%, #172a48 0, transparent 38%),
    var(--bg);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
    Roboto, Helvetica, Arial, sans-serif;
}

.staticrypt-content {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 28px 18px;
  background: transparent;
}

.staticrypt-page {
  width: 100%;
  max-width: 430px;
  margin: auto;
  padding: 0;
}

.staticrypt-form {
  width: 100%;
  max-width: 430px;
  margin: 0;
  padding: 38px;
  border: 1px solid rgba(139, 164, 204, .23);
  border-radius: 24px;
  background: var(--panel);
  box-shadow: 0 24px 80px rgba(0, 0, 0, .38);
  backdrop-filter: blur(18px);
  text-align: left;
}

.staticrypt-instructions {
  margin: 0 0 28px;
  text-align: center;
}

.staticrypt-title {
  margin: 0 0 12px;
  color: var(--text);
  font-size: 29px;
  font-weight: 700;
  letter-spacing: -.8px;
}

.staticrypt-instructions p:not(.staticrypt-title) {
  margin: 0;
  color: var(--muted);
  font-size: 14px;
  line-height: 1.7;
}

.staticrypt-hr {
  display: none;
}

.staticrypt-password-container {
  position: relative;
  width: 100%;
  margin: 0 0 18px;
  overflow: hidden;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: #0d1525;
}

.staticrypt-password-container:focus-within {
  border-color: var(--blue);
  box-shadow: 0 0 0 3px rgba(57, 120, 246, .15);
}

.staticrypt-form input[type="password"],
.staticrypt-form input[type="text"] {
  display: block;
  width: 100%;
  min-height: 52px;
  padding: 15px 46px 15px 16px;
  border: 0;
  outline: 0;
  background: transparent;
  color: var(--text);
  font: inherit;
  font-size: 16px;
}

.staticrypt-form input::placeholder {
  color: #7786a1;
}

.staticrypt-toggle-password-visibility {
  position: absolute;
  top: 50%;
  right: 12px;
  width: 22px;
  height: 22px;
  padding: 2px;
  opacity: .7;
  transform: translateY(-50%);
  cursor: pointer;
}

label.staticrypt-remember {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 0 0 22px;
  color: #c6d0e2;
  font-size: 14px;
  cursor: pointer;
}

.staticrypt-remember input[type="checkbox"] {
  width: 16px;
  height: 16px;
  margin: 0;
  accent-color: var(--blue);
}

.staticrypt-form .staticrypt-decrypt-button {
  width: 100%;
  min-height: 52px;
  padding: 14px 18px;
  border: 0;
  border-radius: 12px;
  background: var(--blue);
  color: white;
  font: inherit;
  font-size: 15px;
  font-weight: 650;
  cursor: pointer;
  transition: background .2s ease, transform .2s ease;
}

.staticrypt-form .staticrypt-decrypt-button:hover {
  background: #2866e7;
  filter: none;
  transform: translateY(-1px);
}

.staticrypt-form .staticrypt-decrypt-button:focus-visible {
  outline: 3px solid #8bb5ff;
  outline-offset: 3px;
}

.staticrypt-spinner-container {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--bg);
}

.staticrypt-spinner {
  width: 36px;
  height: 36px;
  border: 3px solid #34435c;
  border-right-color: var(--blue);
  border-radius: 50%;
  animation: staticrypt-spin .8s linear infinite;
}

@keyframes staticrypt-spin {
  to { transform: rotate(360deg); }
}

.hidden { display: none !important; }

@media (max-width: 480px) {
  .staticrypt-content { padding: 18px 14px; }
  .staticrypt-form { padding: 28px 22px; border-radius: 20px; }
  .staticrypt-title { font-size: 26px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
  }
}

</style>

            // handle password form submission
            document.getElementById("staticrypt-form").addEventListener("submit", async function (e) {
                e.preventDefault();

                const password = document.getElementById("staticrypt-password").value,
                    isRememberChecked = document.getElementById("staticrypt-remember").checked;

                const { isSuccessful } = await staticrypt.handleDecryptionOfPage(password, isRememberChecked);

                if (!isSuccessful) {
                    alert(templateError);
                }
            });
        </script>
